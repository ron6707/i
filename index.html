<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>声笺 · 声音挂饰</title>
<style>
  :root{--paper:#FAF7F1;--ink:#232019;--muted:#8C857A;--accent:#C0704A}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px 22px;background-image:radial-gradient(circle at 20% 0%,#F3EADF 0%,transparent 50%);
  }
  .card{max-width:420px;width:100%;text-align:center}
  .mark{width:56px;height:56px;border-radius:16px;background:var(--ink);color:#F7F1E7;display:flex;align-items:center;
    justify-content:center;font-family:Georgia,"Songti SC",serif;font-size:26px;margin:0 auto 22px}
  h1{font-family:Georgia,"Songti SC","STSong",serif;font-size:26px;font-weight:600;letter-spacing:.04em;margin-bottom:10px}
  p{font-size:14px;color:var(--muted);line-height:2;margin-bottom:28px}
  a.btn{display:inline-block;background:var(--ink);color:#FBF7F0;text-decoration:none;padding:14px 34px;border-radius:99px;
    font-size:14px;letter-spacing:.1em;font-weight:600;transition:.2s}
  a.btn:active{transform:scale(.97)}
  .tip{margin-top:34px;font-size:12px;color:#B6AFA3;line-height:2}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">声</div>
    <h1>声笺 · 声音挂饰</h1>
    <p>扫码听到的每一段声音，<br>都是有人特意为你留下的。</p>
    <a class="btn" href="p/0001.html">进入示例</a>
    <div class="tip">
      这是一次部署测试页。<br>
      看到这行字，说明托管已经生效了。
    </div>
  </div>
</body>
</html>
